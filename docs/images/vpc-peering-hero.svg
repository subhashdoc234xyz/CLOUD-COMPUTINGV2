    <circle cx="30" cy="31" r="14" fill="#2d4137" stroke="#738950"/>
    <text x="30" y="36" text-anchor="middle" font-family="'DM Mono',monospace" font-size="13" fill="#c4e76b">B</text>
    <text x="56" y="29" font-family="'DM Sans',Arial,sans-serif" font-size="18" font-weight="700" fill="#edf2e8">VPC B</text>
    <text x="56" y="47" font-family="'DM Mono',monospace" font-size="11" fill="#91a49b">10.20.0.0/16</text>
    <rect x="20" y="69" width="308" height="78" rx="6" fill="#1d3034" stroke="#35514a"/>
    <text x="37" y="91" font-family="'DM Mono',monospace" font-size="9" letter-spacing="1" fill="#a2b39d">PRIVATE SUBNET</text>
    <rect x="37" y="105" width="29" height="22" rx="4" fill="#30493e"/>
    <text x="51" y="120" text-anchor="middle" font-family="'DM Mono',monospace" font-size="10" fill="#c4e76b">B</text>
    <text x="78" y="120" font-family="'DM Sans',Arial,sans-serif" font-size="13" font-weight="600" fill="#e8eee4">App B</text>
    <text x="294" y="120" text-anchor="end" font-family="'DM Mono',monospace" font-size="10" fill="#91a49b">10.20.1.10</text>
  </g>
  <g>
    <path d="M884 240H1011" stroke="#748c64" stroke-width="2" stroke-dasharray="7 7"/>
    <circle cx="916" cy="240" r="5" fill="#c4e76b"/>
    <circle cx="959" cy="240" r="5" fill="#c4e76b" opacity=".65"/>
    <circle cx="993" cy="240" r="5" fill="#c4e76b" opacity=".35"/>
    <rect x="891" y="194" width="112" height="22" rx="11" fill="#26352d" stroke="#586c49"/>
    <text x="947" y="209" text-anchor="middle" font-family="'DM Mono',monospace" font-size="9" letter-spacing="1" fill="#c4e76b">PEERING ROUTE</text>
  </g>
  <g transform="translate(82 413)" font-family="'DM Mono',monospace" font-size="10" letter-spacing="1">
    <circle cx="4" cy="0" r="4" fill="#c4e76b"/><text x="17" y="4" fill="#95a69d">PRIVATE WORKLOADS</text>
    <circle cx="189" cy="0" r="4" fill="#e5ab63"/><text x="202" y="4" fill="#95a69d">RESTRICTED ADMIN ACCESS</text>
    <text x="1276" y="4" text-anchor="end" fill="#74877f">TWO CIDR BLOCKS · NO OVERLAP</text>
  </g>
