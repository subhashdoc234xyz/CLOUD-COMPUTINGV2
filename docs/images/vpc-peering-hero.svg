<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
  <title id="title">AWS VPC Peering Lab</title>
  <desc id="desc">A dark network diagram showing two isolated private AWS VPCs connected by a peering route, with a bastion and private workloads.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#203238" stroke-width="1" opacity=".55"/>
    </pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15262c"/>
      <stop offset="1" stop-color="#101b21"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="470" rx="18" fill="url(#wash)"/>
  <rect width="1440" height="470" rx="18" fill="url(#grid)" opacity=".7"/>
  <path d="M0 383H1440" stroke="#31464b" opacity=".8"/>
  <g font-family="'DM Mono',Consolas,monospace" fill="#a9b7ae">
    <circle cx="82" cy="74" r="5" fill="#c4e76b"/>
    <text x="99" y="79" font-size="13" letter-spacing="2">EWB COURSES · CLOUD NETWORKING</text>
    <text x="1356" y="79" text-anchor="end" font-size="12" letter-spacing="1">TERRAFORM / LAB 01</text>
  </g>
  <g font-family="'Manrope',Arial,sans-serif" fill="#edf2e8">
    <text x="82" y="171" font-size="51" font-weight="700" letter-spacing="-2.2">AWS VPC</text>
    <text x="82" y="228" font-size="51" font-weight="700" letter-spacing="-2.2">PEERING LAB</text>
  </g>
  <path d="M82 253H122" stroke="#c4e76b" stroke-width="3"/>
  <g font-family="'DM Sans',Arial,sans-serif" fill="#a9b8b1">
    <text x="82" y="294" font-size="17">Two isolated networks, one private route.</text>
    <text x="82" y="323" font-size="17">Built in Terraform. Tested in checkpoints.</text>
  </g>
  <g transform="translate(530 119)">
    <rect x="0" y="0" width="354" height="224" rx="12" fill="#17282e" stroke="#46615b" stroke-width="2"/>
    <circle cx="30" cy="31" r="14" fill="#2d4137" stroke="#738950"/>
    <text x="30" y="36" text-anchor="middle" font-family="'DM Mono',monospace" font-size="13" fill="#c4e76b">A</text>
    <text x="56" y="29" font-family="'DM Sans',Arial,sans-serif" font-size="18" font-weight="700" fill="#edf2e8">VPC A</text>
    <text x="56" y="47" font-family="'DM Mono',monospace" font-size="11" fill="#91a49b">10.10.0.0/16</text>
    <rect x="20" y="69" width="314" height="59" rx="6" fill="#1d3034" stroke="#4c5d43"/>
    <text x="37" y="89" font-family="'DM Mono',monospace" font-size="9" letter-spacing="1" fill="#a2b39d">PUBLIC SUBNET</text>
    <rect x="37" y="99" width="29" height="19" rx="4" fill="#53442e"/>
    <text x="51" y="113" text-anchor="middle" font-family="'DM Mono',monospace" font-size="10" fill="#ecc47e">↗</text>
    <text x="78" y="113" font-family="'DM Sans',Arial,sans-serif" font-size="13" font-weight="600" fill="#e8eee4">Bastion</text>
    <text x="296" y="113" text-anchor="end" font-family="'DM Mono',monospace" font-size="10" fill="#91a49b">10.10.1.10</text>
    <rect x="20" y="142" width="314" height="62" rx="6" fill="#1d3034" stroke="#35514a"/>
    <text x="37" y="163" font-family="'DM Mono',monospace" font-size="9" letter-spacing="1" fill="#a2b39d">PRIVATE SUBNET</text>
    <rect x="37" y="174" width="29" height="19" rx="4" fill="#30493e"/>
    <text x="51" y="188" text-anchor="middle" font-family="'DM Mono',monospace" font-size="10" fill="#c4e76b">A</text>
    <text x="78" y="188" font-family="'DM Sans',Arial,sans-serif" font-size="13" font-weight="600" fill="#e8eee4">App A</text>
    <text x="296" y="188" text-anchor="end" font-family="'DM Mono',monospace" font-size="10" fill="#91a49b">10.10.2.10</text>
  </g>
  <g transform="translate(1011 148)">
